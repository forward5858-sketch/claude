<title>Kart Doğrulama Plan Panosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #EDF0F3;
    --grid: #DCE1E7;
    --surface: #FFFFFF;
    --surface-2: #E4E9EE;
    --ink: #131A22;
    --muted: #5C6875;
    --faint: #8895A3;
    --line: #D5DBE2;
    --line-strong: #B2BCC7;
    --accent: #A95C29;
    --accent-ink: #FFFFFF;
    --accent-soft: #F5E6DA;
    --idle: #6E7C8A;
    --prog: #2F6FB0;
    --ok: #2A8757;
    --crit: #BE4438;
    --teal: #1F7A8C;
    --edge: #55636F;
    --focus: #A95C29;
    --shadow-1: 0 1px 2px rgba(19, 26, 34, .06);
    --shadow-2: 0 2px 4px rgba(19, 26, 34, .08), 0 12px 28px rgba(19, 26, 34, .10);
    --r: 6px;
    --f-display: Archivo, "Helvetica Neue", Arial, sans-serif;
    --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --f-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141A; --grid: #1B2129; --surface: #191F27; --surface-2: #222A33;
      --ink: #E8EDF3; --muted: #98A5B3; --faint: #7A8794; --line: #2A333E; --line-strong: #46525F;
      --accent: #DF9660; --accent-ink: #14181D; --accent-soft: #37281C;
      --idle: #7E8C9A; --prog: #5A9FE0; --ok: #46B07C; --crit: #E06A5C; --teal: #4FB3C6; --edge: #A3B0BD;
      --focus: #DF9660;
      --shadow-1: 0 1px 2px rgba(0, 0, 0, .35);
      --shadow-2: 0 2px 4px rgba(0, 0, 0, .4), 0 12px 28px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141A; --grid: #1B2129; --surface: #191F27; --surface-2: #222A33;
    --ink: #E8EDF3; --muted: #98A5B3; --faint: #7A8794; --line: #2A333E; --line-strong: #46525F;
    --accent: #DF9660; --accent-ink: #14181D; --accent-soft: #37281C;
    --idle: #7E8C9A; --prog: #5A9FE0; --ok: #46B07C; --crit: #E06A5C; --teal: #4FB3C6; --edge: #A3B0BD;
    --focus: #DF9660;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-2: 0 2px 4px rgba(0, 0, 0, .4), 0 12px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--f-body); font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

  /* ---------- command bar ---------- */
  .bar {
    display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap;
    padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; min-width: 0; flex: 1 1 260px; }
  .crumb {
    border: 0; background: none; padding: 3px 6px; border-radius: 4px;
    font-family: var(--f-display); font-weight: 600; font-size: 16px; line-height: 1.15;
    color: var(--muted); max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .crumb:hover { background: var(--surface-2); color: var(--ink); }
  .crumb.current { color: var(--ink); cursor: default; }
  .crumb.current:hover { background: none; }
  .crumb-sep { color: var(--line-strong); font-size: 13px; }

  .search { position: relative; flex: 0 1 250px; min-width: 170px; }
  .search input {
    width: 100%; padding: 6px 30px 6px 30px; border: 1px solid var(--line-strong); border-radius: 5px;
    background: var(--bg); color: var(--ink); font-size: 13px;
  }
  .search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .search .ico, .search .kbd { position: absolute; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .search .ico { left: 9px; font-size: 13px; }
  .search .kbd { right: 8px; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .search input:not(:placeholder-shown) ~ .kbd { display: none; }

  .filters { display: flex; align-items: center; gap: 4px; }
  .fchip {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--muted); white-space: nowrap;
  }
  .fchip:hover { border-color: var(--line-strong); color: var(--ink); }
  .fchip[aria-pressed="true"] { background: var(--surface-2); border-color: var(--line-strong); color: var(--ink); font-weight: 500; }
  .fchip .n { font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }

  .tools { display: flex; align-items: center; gap: 6px; }
  .tools .sep { width: 1px; height: 20px; background: var(--line); }
  .tb {
    padding: 6px 11px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--surface);
    font-weight: 500; font-size: 13px; white-space: nowrap;
  }
  .tb:hover { background: var(--surface-2); }
  .tb.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tb.primary:hover { filter: brightness(1.07); }
  .tb.active { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .tb:disabled { opacity: .4; cursor: not-allowed; }
  .tb.icon { padding: 6px 9px; font-family: var(--f-mono); line-height: 1; }
  .zoom-val { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 4.5ch; text-align: center; font-variant-numeric: tabular-nums; }

  /* ---------- status strip ---------- */
  .strip {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 6px 14px; background: var(--surface); border-bottom: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted);
  }
  .strip .counts { font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-2); flex: 1 1 140px; min-width: 90px; max-width: 340px; }
  .meter i { display: block; height: 100%; }
  .meter i.idle { background: var(--idle); } .meter i.prog { background: var(--prog); }
  .meter i.ok { background: var(--ok); } .meter i.crit { background: var(--crit); }
  .legend-dots { display: flex; flex-wrap: wrap; gap: 3px 12px; }
  .legend-dots span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend-dots b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.idle { background: var(--idle); } .dot.prog { background: var(--prog); }
  .dot.ok { background: var(--ok); } .dot.crit { background: var(--crit); }

  .banner { display: none; padding: 7px 14px; background: var(--accent-soft); color: var(--ink); border-bottom: 1px solid var(--line); font-size: 13px; }
  .banner.show { display: block; }

  /* ---------- workspace ---------- */
  .work { display: grid; grid-template-columns: 1fr 390px; min-height: 0; }
  .canvas-wrap { position: relative; min-width: 0; min-height: 0; }
  .canvas {
    position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
    background-color: var(--bg);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .canvas.panning { cursor: grabbing; }
  .canvas.connecting { cursor: crosshair; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .layer { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .layer .hit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
  .layer .wire { fill: none; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: butt; }
  .layer .wire.next { stroke: var(--edge); }
  .layer .wire.feeds { stroke: var(--accent); }
  .layer .wire.feedback { stroke: var(--teal); stroke-dasharray: 5 4; }
  .layer .wire.blocks { stroke: var(--crit); stroke-width: 2; }
  .layer .wire.other { stroke: var(--faint); stroke-width: 1.5; }
  .layer g[data-edge]:hover .wire, .layer .wire.on { stroke-width: 3; }
  .layer #a-next path { fill: var(--edge); }
  .layer #a-feeds path { fill: var(--accent); }
  .layer #a-feedback path { fill: var(--teal); }
  .layer #a-other path { fill: var(--faint); }
  .layer #a-blocks path { fill: none; stroke: var(--crit); stroke-width: 2.4; }
  .tag-label {
    font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted);
    paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; pointer-events: none;
  }
  .tag-label.feeds { fill: var(--accent); } .tag-label.feedback { fill: var(--teal); }
  .tag-label.blocks { fill: var(--crit); } .tag-label.next { fill: var(--edge); }

  /* ---------- cards ----------
     Rules kept from v3 (docs/pano-ui-kurallari.md): fixed width, content never widens the card,
     rows wrap or ellipsize, the left stripe carries status and hover never repaints it. */
  .node {
    --stripe: var(--idle);
    position: absolute; width: 220px; background: var(--surface);
    border: 1px solid var(--line); border-left: 3px solid var(--stripe); border-radius: var(--r);
    padding: 7px 10px 8px; cursor: grab; user-select: none; -webkit-user-select: none;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px;
    box-shadow: var(--shadow-1);
  }
  .node > * { min-width: 0; }
  .node.branch { width: 240px; box-shadow: var(--shadow-2); }
  .node.prog { --stripe: var(--prog); } .node.ok { --stripe: var(--ok); } .node.crit { --stripe: var(--crit); }
  .node:hover { border-color: var(--line-strong); border-left-color: var(--stripe); }
  .node.selected { border-color: var(--accent); border-left-color: var(--stripe); box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 3px var(--accent), var(--shadow-2); }
  .node.src { box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 3px var(--accent); }
  .canvas.connecting .node:not(.src):hover { border-color: var(--accent); border-left-color: var(--stripe); background: var(--accent-soft); }
  .node.dragging { cursor: grabbing; box-shadow: var(--shadow-2); z-index: 3; }
  .node.dim { opacity: .22; }
  .n-head { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
  .n-head .no { flex: none; letter-spacing: .02em; }
  .n-head .tag { flex: 0 1 auto; min-width: 0; margin-left: auto; text-transform: uppercase; letter-spacing: .07em; font-size: 9.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .n-title { font-family: var(--f-display); font-weight: 600; font-size: 15px; line-height: 1.22; margin: 0; overflow-wrap: anywhere; }
  .node.branch .n-title { font-size: 16px; }
  .n-sum {
    margin: 1px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.35; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .n-meter { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--surface-2); margin-top: 5px; }
  .n-meter i { display: block; height: 100%; }
  .n-meter i.idle { background: var(--idle); } .n-meter i.prog { background: var(--prog); }
  .n-meter i.ok { background: var(--ok); } .n-meter i.crit { background: var(--crit); }
  .n-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
  .n-foot .st { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .n-foot .st span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .n-go { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
  .kids { font-family: var(--f-mono); font-size: 11px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .enter {
    flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 4px;
    width: 24px; height: 21px; font-size: 12px; line-height: 1; padding: 0; color: var(--muted);
  }
  .enter:hover { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }

  .hint {
    display: none; position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5;
    background: var(--ink); color: var(--bg); padding: 7px 13px; border-radius: 5px; font-size: 12.5px; box-shadow: var(--shadow-2);
  }
  .hint.show { display: block; }
  .wires-key {
    position: absolute; left: 12px; bottom: 12px; z-index: 3; display: flex; flex-wrap: wrap; gap: 3px 13px;
    padding: 5px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    font-size: 11px; color: var(--muted); max-width: calc(100% - 24px);
  }
  .wires-key span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .wires-key svg { width: 26px; height: 8px; overflow: visible; }
  .wires-key .next { color: var(--edge); } .wires-key .feeds { color: var(--accent); }
  .wires-key .feedback { color: var(--teal); } .wires-key .blocks { color: var(--crit); } .wires-key .other { color: var(--faint); }

  .results {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 6; width: min(560px, calc(100% - 24px));
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow-2);
    max-height: 60%; overflow: auto; display: none;
  }
  .results.show { display: block; }
  .results h4 { margin: 0; padding: 8px 12px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 600; border-bottom: 1px solid var(--line); }
  .results button {
    display: grid; gap: 1px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
    background: none; padding: 8px 12px;
  }
  .results button:last-child { border-bottom: 0; }
  .results button:hover { background: var(--surface-2); }
  .results .path { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .ttl { font-family: var(--f-display); font-weight: 600; font-size: 14px; }
  .results .none { padding: 12px; color: var(--muted); font-size: 13px; }

  /* ---------- inspector ---------- */
  .panel { background: var(--surface); border-left: 1px solid var(--line); overflow: auto; min-height: 0; position: relative; }
  .p-empty { padding: 24px 20px; display: grid; gap: 14px; align-content: start; }
  .p-empty h2 { font-family: var(--f-display); font-weight: 700; font-size: 19px; margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .p-empty p { margin: 0; color: var(--muted); max-width: 44ch; }
  .keys { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .keys li { display: flex; align-items: baseline; gap: 9px; font-size: 12.5px; color: var(--muted); }
  .keys kbd {
    font-family: var(--f-mono); font-size: 11px; background: var(--bg); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--ink); flex: none; min-width: 5.5ch; text-align: center;
  }
  .p-head { padding: 15px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 5px; }
  .p-head .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .p-id { font-family: var(--f-mono); font-size: 11px; color: var(--faint); letter-spacing: .05em; }
  .p-title { font-family: var(--f-display); font-weight: 700; font-size: 19px; line-height: 1.18; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
  .p-meta { font-size: 12px; color: var(--faint); }
  .close { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 2px 8px; font-size: 12px; color: var(--muted); }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 12px 18px 0; }
  .seg button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 4px;
    font-size: 11.5px; color: var(--muted); display: grid; justify-items: center; gap: 3px; line-height: 1.2;
  }
  .seg button:hover { border-color: var(--line-strong); color: var(--ink); }
  .seg button[aria-pressed="true"] { color: var(--ink); font-weight: 600; background: var(--surface-2); }
  .seg button[aria-pressed="true"].idle { border-color: var(--idle); box-shadow: inset 0 -2px 0 var(--idle); }
  .seg button[aria-pressed="true"].prog { border-color: var(--prog); box-shadow: inset 0 -2px 0 var(--prog); }
  .seg button[aria-pressed="true"].ok { border-color: var(--ok); box-shadow: inset 0 -2px 0 var(--ok); }
  .seg button[aria-pressed="true"].crit { border-color: var(--crit); box-shadow: inset 0 -2px 0 var(--crit); }

  .p-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 18px; }
  .btn { padding: 6px 11px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; font-size: 12.5px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { border-color: var(--line); color: var(--ink); }
  .btn.danger { margin-left: auto; border-color: transparent; color: var(--crit); }
  .btn.danger:hover { background: var(--crit); color: #fff; border-color: var(--crit); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  form { padding: 0 0 92px; display: grid; }
  .fld { display: grid; gap: 4px; padding: 12px 18px 0; }
  .fld label { font-size: 11px; font-weight: 600; letter-spacing: .05em; color: var(--faint); text-transform: uppercase; }
  .fld label small { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .fld input, .fld textarea, .fld select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--bg); color: var(--ink); line-height: 1.45; font-size: 13px;
    font-family: inherit;
  }
  .fld textarea { min-height: 70px; resize: vertical; }
  .fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 18px 0; }
  .two .fld { padding: 0; }

  .grp { border-top: 1px solid var(--line); margin-top: 14px; }
  .grp > summary {
    list-style: none; cursor: pointer; padding: 10px 18px; display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  .grp > summary::-webkit-details-marker { display: none; }
  .grp > summary:hover { background: var(--surface-2); color: var(--ink); }
  .grp > summary .caret { font-family: var(--f-mono); font-size: 10px; color: var(--faint); transition: transform .15s ease; }
  .grp[open] > summary .caret { transform: rotate(90deg); }
  .grp > summary .fill { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); flex: none; }
  .grp > summary .fill.on { background: var(--accent); }
  .grp .body { padding-bottom: 14px; }

  .savebar {
    position: sticky; bottom: 0; display: flex; align-items: center; gap: 9px;
    padding: 11px 18px; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,.06);
  }
  .savebar .note { margin-left: auto; font-size: 12px; color: var(--faint); }
  .savebar .note.on { color: var(--prog); }

  .sect { padding: 12px 18px 14px; border-top: 1px solid var(--line); }
  .sect h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .sect h3 .n { font-family: var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  .list { display: grid; gap: 4px; }
  .li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); font-size: 12.5px; }

        (inE.length + outE.length ? outE.map(function (e) { return edgeLi(e, "out"); }).join("") + inE.map(function (e) { return edgeLi(e, "in"); }).join("")
          : '<div class="none-li">Bağlantı yok. Kutuyu seçip <b>Bağla</b> ile kur.</div>') +
      '</div></div>' +
      '<div class="sect"><h3>Alt kutular <span class="n">' + kids.length + '</span></h3><div class="list">' +
        (kids.length ? kids.map(function (c) {
          var cs = stOf(c);
          return '<div class="li link" data-enter="' + esc(n.id) + '" data-then="' + esc(c.id) + '"><i class="dot ' + cs.cls + '"></i>' +
            '<span class="grow">' + esc(pad(c.order) + " " + c.title) + '</span><span class="k">' + childrenOf(c.id).length + ' alt</span></div>';
        }).join("") : '<div class="none-li">Alt kutu yok. <b>+ İçine kutu</b> ile başla.</div>') +
      '</div></div>';
    dirty = false;
    var form = $("form");
    form.addEventListener("input", function () { setDirty(true); });
    form.addEventListener("submit", function (ev) { ev.preventDefault(); saveNode(); });
    Array.prototype.forEach.call(p.querySelectorAll(".seg button"), function (b) {
      b.addEventListener("click", function () {
        if (readonly) return;
        form.status.value = b.getAttribute("data-st");
        Array.prototype.forEach.call(p.querySelectorAll(".seg button"), function (o) { o.setAttribute("aria-pressed", String(o === b)); });
        setDirty(true);
      });
    });
    Array.prototype.forEach.call(p.querySelectorAll("details.grp"), function (d) {
      d.addEventListener("toggle", function () { openGroups[d.getAttribute("data-grp")] = d.open; });
    });
    $("resetBtn").addEventListener("click", function () { dirty = false; renderPanel(); });
    $("closeBtn").addEventListener("click", function () { select(null, null); });
    $("addInsideBtn").addEventListener("click", function () { addNode(n.id); });
    $("connectBtn2").addEventListener("click", function () { startConnect(); });
    $("delNodeBtn").addEventListener("click", function () { deleteNode(n.id); });
  }

  function panelEdge(p, e) {
    var a = nodes[e.from], b = nodes[e.to], t = edgeOf(e), ro = readonly ? " disabled" : "";
    p.innerHTML =
      '<div class="p-head">' +
        '<div class="row"><span class="p-id">BAĞLANTI · ' + esc(t.label.toLocaleUpperCase("tr")) + '</span>' +
        '<button type="button" class="close" id="closeBtn">Kapat</button></div>' +
        '<h2 class="p-title">' + esc(pad(a.order) + " " + a.title) + '</h2>' +
        '<div class="p-meta">' + esc(t.verb) + ' <b>' + esc(pad(b.order) + " " + b.title) + '</b></div>' +
      '</div>' +
      '<form id="eform">' +
        '<div class="fld"><label for="e_type">İlişki tipi</label><select id="e_type" name="type"' + ro + '>' +
          EDGE_ORDER.map(function (k) { return '<option value="' + k + '"' + (k === (EDGE[e.type] ? e.type : "other") ? " selected" : "") + '>' + esc(EDGE[k].label) + '</option>'; }).join("") +
        '</select></div>' +
        '<div class="fld"><label for="e_label">Etiket <small>· çizgide görünür</small></label>' +
          '<input id="e_label" name="label" value="' + esc(e.label) + '"' + ro + ' placeholder="ör. onaylı test item listesi"></div>' +
        '<div class="savebar"><button type="submit" class="btn primary"' + ro + '>Kaydet</button>' +
          '<button type="button" class="btn ghost" id="swapBtn"' + ro + '>Yönü çevir</button>' +
          '<button type="button" class="btn danger" id="delEdgeBtn"' + ro + '>Sil</button></div>' +
      '</form>';
    dirty = false;
    $("eform").addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (!db) return;
      db.doc("edges/" + e.id).update({ type: $("e_type").value, label: $("e_label").value.trim(), updatedAt: now(), updatedBy: "kullanici" })
        .then(function () { toast("Bağlantı kaydedildi"); }).catch(function (err) { toast(dbError(err, "Kayıt")); });
    });
    $("swapBtn").addEventListener("click", function () {
      if (!db) return;
      db.doc("edges/" + e.id).update({ from: e.to, to: e.from, updatedAt: now(), updatedBy: "kullanici" })
        .then(function () { toast("Yön çevrildi"); }).catch(function (err) { toast(dbError(err, "Değişiklik")); });
    });
    $("delEdgeBtn").addEventListener("click", function () { deleteEdge(e.id); });
    $("closeBtn").addEventListener("click", function () { select(null, null); });
  }

  function setDirty(v) {
    dirty = v; var n = $("note"); if (!n) return;
    n.textContent = v ? "Kaydedilmemiş değişiklik" : "Değişiklik yok"; n.classList.toggle("on", v);
  }
  function renderAll() { renderCanvas(); renderPanel(); }

  /* ---------- navigation ---------- */
  function select(kind, id) {
    if (dirty && !(sel.kind === kind && sel.id === id) && !window.confirm("Kaydedilmemiş değişiklikler var. Yine de devam edilsin mi?")) return false;
    sel = { kind: kind, id: id }; dirty = false;
    renderCanvas(); renderPanel();
    return true;
  }
  function go(parentId, thenSelect) {
    if (dirty && !window.confirm("Kaydedilmemiş değişiklikler var. Yine de devam edilsin mi?")) return;
    cancelConnect();
    cur = parentId; sel = { kind: null, id: null }; dirty = false;
    renderCanvas();
    if (views[cur]) { view = views[cur]; applyView(); } else { fit(); }
    if (thenSelect && nodes[thenSelect]) sel = { kind: "node", id: thenSelect };
    renderAll();
  }
  function goToNode(id) {
    var n = nodes[id]; if (!n) return;
    $("q").value = ""; query = ""; renderResults();
    go(n.parentId, id);
  }

  /* ---------- mutations ---------- */
  function saveNode() {
    if (!db || readonly || sel.kind !== "node") return;
    var form = $("form"), id = sel.id;
    var payload = { title: form.title.value.trim(), summary: form.summary.value.trim(), status: form.status.value, tag: form.tag.value.trim(), updatedAt: now(), updatedBy: "kullanici" };
    if (!payload.title) { toast("Başlık boş olamaz."); return; }
    FIELDS.forEach(function (f) { payload[f.key] = form[f.key].value.trim(); });
    $("saveBtn").disabled = true;
    db.doc("nodes/" + id).update(payload).then(function () {
      if (nodes[id]) Object.assign(nodes[id], payload);
      dirty = false; renderAll(); toast("Kaydedildi");
    }).catch(function (e) { toast(dbError(e, "Kayıt")); if ($("saveBtn")) $("saveBtn").disabled = false; });
  }
  function addNode(parentId) {
    if (!db || readonly) return;
    var sibs = childrenOf(parentId), order = sibs.reduce(function (m, n) { return Math.max(m, n.order || 0); }, 0) + 1, pos;
    if (parentId === cur) {
      var r = canvas.getBoundingClientRect();
      pos = worldPoint(r.left + r.width / 2, r.top + r.height / 2);
      pos = { x: gsnap(pos.x - W_LEAF / 2), y: gsnap(pos.y - 50) };
    } else {
      pos = { x: 40 + (sibs.length % 4) * COL, y: 40 + Math.floor(sibs.length / 4) * ROW };
    }
    var id = uid("n_");
    var data = { parentId: parentId, order: order, title: "Yeni kutu " + order, summary: "", status: "bekliyor", tag: "", x: pos.x, y: pos.y,
      girdi: "", cikti: "", ai_rolu: "", kod_rolu: "", kontrol_noktasi: "", notlar: "", updatedAt: now(), updatedBy: "kullanici" };
    db.doc("nodes/" + id).set(data).then(function () {
      nodes[id] = Object.assign({ id: id }, data);
      if (parentId !== cur) go(parentId, id); else select("node", id);
      var t = $("f_title"); if (t) { t.focus(); t.select(); }
    }).catch(function (e) { toast(dbError(e, "Kutu ekleme")); });
  }
  function deleteNode(id) {
    if (!db || readonly || !nodes[id]) return;
    var n = nodes[id], sub = descendants(id);
    if (!window.confirm('"' + n.title + '" silinsin mi?' + (sub.length ? " İçindeki " + sub.length + " alt kutu ve bağlantıları da silinecek." : ""))) return;
    var ids = [id].concat(sub), idSet = {}; ids.forEach(function (x) { idSet[x] = true; });
    var edgeIds = Object.keys(edges).filter(function (k) { var e = edges[k]; return idSet[e.from] || idSet[e.to] || idSet[e.parentId]; });
    var ops = edgeIds.map(function (k) { return function () { return db.doc("edges/" + k).delete(); }; })
      .concat(ids.map(function (k) { return function () { return db.doc("nodes/" + k).delete(); }; }));
    var chain = Promise.resolve();
    ops.forEach(function (op) { chain = chain.then(op); });
    chain.then(function () {
      edgeIds.forEach(function (k) { delete edges[k]; }); ids.forEach(function (k) { delete nodes[k]; });
      dirty = false; sel = { kind: null, id: null }; renderAll(); toast("Silindi: " + n.title);
    }).catch(function (e) { toast(dbError(e, "Silme")); });
  }
  function deleteEdge(id) {
    if (!db || readonly || !edges[id]) return;
    db.doc("edges/" + id).delete().then(function () {
      delete edges[id]; if (sel.kind === "edge" && sel.id === id) sel = { kind: null, id: null };
      renderAll(); toast("Bağlantı silindi");
    }).catch(function (e) { toast(dbError(e, "Silme")); });
  }
  function createEdge(from, to, type) {
    if (!db || readonly) return;
    if (visibleEdges().some(function (e) { return e.from === from && e.to === to && e.type === type; })) { toast("Bu bağlantı zaten var."); cancelConnect(); return; }
    var id = uid("e_"), data = { parentId: cur, from: from, to: to, type: type, label: "", updatedAt: now(), updatedBy: "kullanici" };
    db.doc("edges/" + id).set(data).then(function () {
      edges[id] = Object.assign({ id: id }, data); cancelConnect();
      sel = { kind: "edge", id: id }; renderAll(); toast(EDGE[type].label + ": " + pad(nodes[from].order) + " → " + pad(nodes[to].order));
    }).catch(function (e) { toast(dbError(e, "Bağlantı")); cancelConnect(); });
  }
  function autoLayout() {
    if (!db || readonly) return;
    var vis = visibleNodes(), ids = vis.map(function (n) { return n.id; }), inDeg = {}, out = {};
    ids.forEach(function (i) { inDeg[i] = 0; out[i] = []; });
    visibleEdges().filter(function (e) { return e.type === "next" && e.from !== e.to; }).forEach(function (e) { out[e.from].push(e.to); inDeg[e.to]++; });
    var layer = {}, queue = ids.filter(function (i) { return inDeg[i] === 0; }), seen = 0;
    queue.forEach(function (i) { layer[i] = 0; });
    while (queue.length) {
      var u = queue.shift(); seen++;
      out[u].forEach(function (v) { layer[v] = Math.max(layer[v] || 0, layer[u] + 1); if (--inDeg[v] === 0) queue.push(v); });
    }
    if (seen < ids.length) ids.forEach(function (i) { if (layer[i] === undefined) layer[i] = 0; });
    var cols = {};
    vis.forEach(function (n) { (cols[layer[n.id]] = cols[layer[n.id]] || []).push(n); });
    var updates = [];
    Object.keys(cols).forEach(function (L) {
      var y = 40;
      cols[L].forEach(function (n) { updates.push({ id: n.id, x: 40 + Number(L) * COL, y: y }); y += (sizes[n.id] ? sizes[n.id].h : 110) + 46; });
    });
    var chain = Promise.resolve();
    updates.forEach(function (u) { chain = chain.then(function () { return db.doc("nodes/" + u.id).update({ x: u.x, y: u.y }); }); });
    chain.then(function () { updates.forEach(function (u) { if (nodes[u.id]) { nodes[u.id].x = u.x; nodes[u.id].y = u.y; } }); renderCanvas(); fit(); toast("Dizildi"); })
      .catch(function (e) { toast(dbError(e, "Dizme")); });
  }

  /* ---------- connect ---------- */
  function startConnect() {
    if (readonly || sel.kind !== "node") return;
    connectFrom = sel.id; canvas.classList.add("connecting");
    hint("Hedef kutuya tıklayın · Esc iptal"); renderCanvas();
  }
  function cancelConnect() {
    connectFrom = null; canvas.classList.remove("connecting"); hint(""); hidePicker(); renderToolbar();
    Array.prototype.forEach.call(nodeLayer.querySelectorAll(".src"), function (el) { el.classList.remove("src"); });
  }
  var pickerTarget = null;
  function showPicker(to, clientX, clientY) {
    pickerTarget = to;
    var pk = $("picker");
    pk.innerHTML = '<h4>' + esc(pad(nodes[connectFrom].order)) + ' → ' + esc(pad(nodes[to].order) + " " + nodes[to].title) + '</h4>' +
      EDGE_ORDER.map(function (k) { return '<button type="button" data-type="' + k + '"><i class="' + k + '"></i>' + esc(EDGE[k].label) + '</button>'; }).join("") +
      '<button type="button" class="cancel" data-type="">Vazgeç</button>';
    pk.classList.add("show");
    pk.style.left = Math.max(8, Math.min(window.innerWidth - pk.offsetWidth - 8, clientX + 8)) + "px";
    pk.style.top = Math.max(8, Math.min(window.innerHeight - pk.offsetHeight - 8, clientY + 8)) + "px";
    var first = pk.querySelector("button"); if (first) first.focus();
  }
  function hidePicker() { $("picker").classList.remove("show"); pickerTarget = null; }
  $("picker").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-type]"); if (!b) return;
    var type = b.getAttribute("data-type");
    if (!type) { cancelConnect(); return; }
    createEdge(connectFrom, pickerTarget, type);
  });

  /* ---------- pointer ---------- */
  canvas.addEventListener("pointerdown", function (ev) {
    if (ev.button !== 0) return;
    if (ev.target.closest("button, input, textarea, select, a")) return;
    if (ev.target.closest && ev.target.closest(".hit")) return;
    var nodeEl = ev.target.closest(".node");
    ev.preventDefault();
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    if (nodeEl) {
      var id = nodeEl.getAttribute("data-id"), n = nodes[id];
      drag = { kind: "node", id: id, el: nodeEl, sx: ev.clientX, sy: ev.clientY, ox: n.x, oy: n.y, moved: false };
    } else {
      drag = { kind: "pan", sx: ev.clientX, sy: ev.clientY, ox: view.x, oy: view.y, moved: false };
      canvas.classList.add("panning");
    }
  });
  canvas.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) {
      drag.moved = true;
      if (drag.kind === "node") { if (readonly || connectFrom) drag.kind = "noop"; else drag.el.classList.add("dragging"); }
    }
    if (!drag.moved) return;
    if (drag.kind === "pan") { view.x = drag.ox + dx; view.y = drag.oy + dy; applyView(); }
    else if (drag.kind === "node") {
      var n = nodes[drag.id]; n.x = gsnap(drag.ox + dx / view.k); n.y = gsnap(drag.oy + dy / view.k);
      drag.el.style.left = n.x + "px"; drag.el.style.top = n.y + "px";
      sizes[n.id] = { w: drag.el.offsetWidth, h: drag.el.offsetHeight };
      renderWires();
    }
  });
  function endDrag(ev) {
    if (!drag) return;
    var d = drag; drag = null; canvas.classList.remove("panning");
    try { canvas.releasePointerCapture(ev.pointerId); } catch (e) {}
    if (d.kind === "node" && d.moved) {
      d.el.classList.remove("dragging");
      var n = nodes[d.id];
      if (db) db.doc("nodes/" + d.id).update({ x: n.x, y: n.y }).catch(function (e) { toast(dbError(e, "Taşıma")); });
      return;
    }
    if ((d.kind === "node" || d.kind === "noop") && !d.moved) { onNodeClick(d.id, ev); return; }
    if (d.kind === "pan" && !d.moved) { if (connectFrom) { cancelConnect(); renderCanvas(); } else if (sel.kind) select(null, null); }
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  function onNodeClick(id, ev) {
    if (connectFrom) {
      if (id === connectFrom) { toast("Kutu kendisine bağlanamaz; başka bir kutu seçin."); return; }
      showPicker(id, ev.clientX, ev.clientY); return;
    }
    var t = Date.now();
    if (lastClick.id === id && t - lastClick.t < 380) { lastClick = { id: null, t: 0 }; go(id); return; }
    lastClick = { id: id, t: t };
    select("node", id);
  }
  canvas.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var r = canvas.getBoundingClientRect();
    zoomAt(Math.exp(-ev.deltaY * 0.0012), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });
  canvas.addEventListener("click", function (ev) {
    var hit = ev.target.closest && ev.target.closest("[data-edge]");
    if (hit) select("edge", hit.getAttribute("data-edge"));
  });

  /* ---------- chrome events ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-enter]");
    if (t) { ev.stopPropagation(); go(t.getAttribute("data-enter"), t.getAttribute("data-then")); return; }
    var g = ev.target.closest("[data-goto]");
    if (g) { goToNode(g.getAttribute("data-goto")); return; }
    var c = ev.target.closest("[data-go]");
    if (c) { if (c.getAttribute("data-go") !== cur) go(c.getAttribute("data-go")); return; }
    var f = ev.target.closest("[data-filter]");
    if (f) { var k = f.getAttribute("data-filter"); filter[k] = !filter[k]; renderCanvas(); return; }
    var se = ev.target.closest("[data-seledge]");
    if (se) { select("edge", se.getAttribute("data-seledge")); return; }
    var de = ev.target.closest("[data-deledge]");
    if (de) { deleteEdge(de.getAttribute("data-deledge")); return; }
  });
  $("q").addEventListener("input", function () { query = this.value.trim(); renderNodes(); renderResults(); });
  $("q").addEventListener("keydown", function (ev) { if (ev.key === "Escape") { this.value = ""; query = ""; renderNodes(); renderResults(); this.blur(); } });
  document.addEventListener("keydown", function (ev) {
    var el = document.activeElement, inField = el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
    if (ev.key === "/" && !inField) { ev.preventDefault(); $("q").focus(); return; }
    if (ev.key === "Escape") {
      if (query) { $("q").value = ""; query = ""; renderNodes(); renderResults(); return; }
      if (connectFrom) { cancelConnect(); renderCanvas(); return; }
      if (!inField && sel.kind) select(null, null);
      return;
    }
    if (inField) return;
    if (ev.key === "Enter" && sel.kind === "node") { ev.preventDefault(); go(sel.id); return; }
    if ((ev.key === "n" || ev.key === "N") && !readonly) { ev.preventDefault(); addNode(cur); return; }
    if (ev.key === "f" || ev.key === "F") { ev.preventDefault(); fit(); return; }
    if ((ev.key === "Delete" || ev.key === "Backspace") && !readonly) {
      if (sel.kind === "edge") deleteEdge(sel.id); else if (sel.kind === "node") deleteNode(sel.id);
    }
  });
  $("addBtn").addEventListener("click", function () { addNode(cur); });
  $("connectBtn").addEventListener("click", function () { if (connectFrom) { cancelConnect(); renderCanvas(); } else startConnect(); });
  $("layoutBtn").addEventListener("click", autoLayout);
  $("zoomIn").addEventListener("click", function () { var r = canvas.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); });
  $("zoomOut").addEventListener("click", function () { var r = canvas.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); });
  $("fitBtn").addEventListener("click", fit);
  window.addEventListener("resize", function () { renderWires(); });

  /* ---------- data ---------- */
  function useFallback(reason) {
    readonly = true; nodes = {}; edges = {};
    FB.forEach(function (r) { nodes[r[0]] = { id: r[0], parentId: "root", order: r[1], tag: r[2], x: r[3], y: r[4], title: r[5], summary: r[6], status: "bekliyor", girdi: "", cikti: "", ai_rolu: "", kod_rolu: "", kontrol_noktasi: "", notlar: "" }; });
    for (var i = 0; i < FB.length - 1; i++) edges["e" + i] = { id: "e" + i, parentId: "root", from: FB[i][0], to: FB[i + 1][0], type: "next", label: "" };
    banner(reason); cur = "root"; sel = { kind: null, id: null };
    renderAll(); fit();
  }
  var gotNodes = false, gotEdges = false, firstFit = false;
  function afterSnapshot() {
    if (!gotNodes || !gotEdges) return;
    readonly = false; banner("");
    if (cur !== "root" && !nodes[cur]) { cur = "root"; sel = { kind: null, id: null }; }
    if (sel.kind === "node" && !nodes[sel.id]) sel = { kind: null, id: null };
    if (sel.kind === "edge" && !edges[sel.id]) sel = { kind: null, id: null };
    renderCanvas();
    if (!dirty) renderPanel();
    if (!firstFit) { firstFit = true; fit(); }
  }
  useFallback("Bağlanıyor…");

  Promise.resolve(window.claude && window.claude.use ? window.claude.use("db") : null).then(function (ns) {
    if (!ns) { useFallback("Salt okunur görünüm. Düzenlemek için sayfayı claude.ai içinde açın."); return; }
    db = ns;
    var onErr = function (e) { db = null; useFallback(e && e.code === "revoked" ? "Erişim değişti; pano salt okunur." : "Pano verisine ulaşılamadı; salt okunur görünüm."); };
    db.collection("nodes").onSnapshot(function (snap) {
      var next = {};
      snap.docs.forEach(function (d) {
        var v = Object.assign({ id: d.id }, d.data());
        if (drag && drag.kind === "node" && drag.id === d.id && nodes[d.id]) { v.x = nodes[d.id].x; v.y = nodes[d.id].y; }
        next[d.id] = v;
      });
      nodes = next; gotNodes = true; afterSnapshot();
    }, onErr);
    db.collection("edges").onSnapshot(function (snap) {
      var next = {};
      snap.docs.forEach(function (d) { next[d.id] = Object.assign({ id: d.id }, d.data()); });
      edges = next; gotEdges = true; afterSnapshot();
    }, onErr);
  }).catch(function () { useFallback("Salt okunur görünüm. Düzenlemek için sayfayı claude.ai içinde açın."); });
})();
</script>
